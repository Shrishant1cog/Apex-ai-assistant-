plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aiassistant.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aiassistant.mobile'
        minSdk 26
        targetSdk 36
        versionCode (project.findProperty('apexVersionCode') ?: '1').toInteger()
        versionName '0.1.0'
    }
}
