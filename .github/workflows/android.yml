name: Android Debug Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/apex-debug.apk'
  workflow_dispatch:

# Avoid two publishers racing to update the same branch.
concurrency:
  group: apex-android-build-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate persistent signing configuration
        env:
          APEX_KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          test -n "$APEX_KEYSTORE_BASE64" || { echo "::error::Configure APEX_KEYSTORE_BASE64 secret before release builds."; exit 1; }
          test -n "$APEX_KEYSTORE_PASSWORD" || { echo "::error::Missing APEX_KEYSTORE_PASSWORD secret."; exit 1; }
          test -n "$APEX_KEY_ALIAS" || { echo "::error::Missing APEX_KEY_ALIAS secret."; exit 1; }
          test -n "$APEX_KEY_PASSWORD" || { echo "::error::Missing APEX_KEY_PASSWORD secret."; exit 1; }
          echo "$APEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apex-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/apex-release.jks" -storepass "$APEX_KEYSTORE_PASSWORD" -alias "$APEX_KEY_ALIAS" >/dev/null
      - name: Build and sign debug APK with persistent key
        env:
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleDebug -PapexVersionCode="$VERSION_CODE"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apex-unsigned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/apex-release.jks" \
            --ks-key-alias "$APEX_KEY_ALIAS" \
            --ks-pass env:APEX_KEYSTORE_PASSWORD \
            --key-pass env:APEX_KEY_PASSWORD \
            --out app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/apex-unsigned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest APK to repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apex-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync to the current remote main before preparing the APK commit.
          # This avoids non-fast-forward rejections if main changed during build.
          git fetch origin main
          git reset --hard origin/main
          mkdir -p release
          cp /tmp/apex-debug.apk release/apex-debug.apk
          git add release/apex-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish latest debug APK"
          git push origin HEAD:main
      - name: Publish downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          TAG="apex-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apex-debug.apk
          gh release create "$TAG" /tmp/apex-debug.apk#apex-debug.apk \
            --title "Apex AI Assistant - Build ${RUN_NUMBER}" \
            --notes "Automated Android debug build from commit ${SOURCE_SHA}. Download apex-debug.apk below. Debug build for testing, not a signed production release." \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: apex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
