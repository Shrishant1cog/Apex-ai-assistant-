name: Android Debug Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/apex-debug.apk'
  workflow_dispatch:

# Avoid two publishers racing to update the same branch.
concurrency:
  group: apex-android-build-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish latest APK to repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apex-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync to the current remote main before preparing the APK commit.
          # This avoids non-fast-forward rejections if main changed during build.
          git fetch origin main
          git reset --hard origin/main
          mkdir -p release
          cp /tmp/apex-debug.apk release/apex-debug.apk
          git add release/apex-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish latest debug APK"
          git push origin HEAD:main
      - name: Publish downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apex-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Apex AI Assistant • Build ${{ github.run_number }}" \
            --notes "Automated Android debug build from commit ${{ github.sha }}.

          Download apex-debug.apk below. This is a debug build for testing, not a signed production release." \
            --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: apex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
